<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>REFUND / INTELLIGENCE</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{font-family:'DM Sans',Arial,sans-serif;background:#07111d;color:#e9f3fa}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:242px 1fr;min-height:100vh}.side{background:#0a1724;border-right:1px solid #233547;padding:28px 17px;display:flex;flex-direction:column}.brand{padding:4px 12px 35px;font-family:'Space Grotesk';font-size:22px;font-weight:700;letter-spacing:-1px}.brand em{font-style:normal;color:#50e3c2}.brand small{display:block;font:500 10px 'DM Sans';color:#738da0;letter-spacing:2.2px;margin-top:6px}.nav{display:flex;align-items:center;gap:13px;color:#8fa8b8;padding:15px;border-radius:12px;margin-bottom:5px;font-size:13px;border:1px solid transparent;background:none;text-align:left;width:100%}.nav.active{background:#123041;color:#7df3d5;border-color:#235265}.nav:hover{background:#132637}.nav .symbol{font-size:19px;width:23px}.foot{margin-top:auto;padding:14px;color:#71909e;font-size:11px;line-height:1.7}.foot strong{color:#77e5cb}.main{padding:28px 40px 70px;max-width:1750px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1c3040;padding-bottom:22px;margin-bottom:30px}.eyebrow{font-size:10px;letter-spacing:2.3px;color:#57d7c4;font-weight:700}.topright{display:flex;align-items:center;gap:14px;font-size:12px;color:#b4c8d6}.live{width:8px;height:8px;border-radius:100%;background:#4ce6bb;box-shadow:0 0 15px #4ce6bb}.avatar{border-radius:50%;background:#1d6370;padding:11px;font-weight:700;color:#b5ffec}.hero{display:flex;justify-content:space-between;align-items:end;margin-bottom:27px}h1{font:600 39px 'Space Grotesk';letter-spacing:-1.5px;margin:8px 0}h2{font:600 20px 'Space Grotesk';margin:3px 0 12px}h3{font:600 15px 'Space Grotesk'}p{color:#91a8b8;font-size:13px;line-height:1.7;margin:6px 0}.button{background:#53e5c7;color:#092127;border:0;border-radius:10px;padding:12px 17px;font-weight:700;font-size:12px}.button.secondary{background:#15293a;color:#e2f5fa;border:1px solid #315065}.button:disabled{opacity:.45;cursor:not-allowed}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:linear-gradient(145deg,#112334,#0b1b2b);border:1px solid #263c50;border-radius:15px;padding:23px}.card small{font-size:10px;letter-spacing:1.3px;color:#829dad}.card strong{display:block;font:600 32px 'Space Grotesk';margin:16px 0 5px}.card .sub{color:#5fe4c7;font-size:11px}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:17px;margin-top:18px}.panel{min-height:240px}.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.tag{font-size:10px;border:1px solid #2d5560;background:#12383f;border-radius:30px;padding:7px 10px;color:#73e6ce}.muted{color:#7894a6}.barrow{display:flex;align-items:center;gap:12px;margin:16px 0;font-size:12px}.barrow span{width:115px;color:#afc4d0}.track{height:8px;flex:1;background:#1e3545;border-radius:20px;overflow:hidden}.fill{height:100%;background:#51e2c5;border-radius:20px}.barrow b{width:38px;text-align:right}.list{display:flex;flex-direction:column;gap:9px}.case{display:flex;align-items:center;gap:12px;border:1px solid #243c4e;background:#102537;padding:13px 15px;border-radius:11px;cursor:pointer}.case:hover,.case.sel{border-color:#53e5c7;background:#143445}.caseid{font-weight:700;font-size:13px}.case small{display:block;color:#829cab;margin-top:4px;font-size:11px}.risk{margin-left:auto;border-radius:30px;padding:5px 9px;background:#402b3a;color:#ff9eac;font-size:10px;text-transform:uppercase}.risk.low{background:#164237;color:#64efc3}.risk.medium{background:#403929;color:#f1d088}.amount{font-weight:700;margin-left:auto}.workspace{display:grid;grid-template-columns:370px minmax(0,1fr);gap:18px}.workpanel{background:#0d2030;border:1px solid #2b4053;border-radius:14px;padding:20px}.input,textarea{background:#081826;border:1px solid #335065;color:#e6f5fa;border-radius:10px;padding:12px;width:100%;outline:none}.input:focus,textarea:focus{border-color:#53e5c7}.detailgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.fact{background:#112a3a;padding:15px;border-radius:10px}.fact small{color:#7796a6;display:block;font-size:10px;margin-bottom:8px}.fact b{font-size:14px}.agent{background:linear-gradient(120deg,#113f43,#11283b);border:1px solid #35746e;border-radius:14px;padding:21px;margin:18px 0}.agenttop{display:flex;align-items:center;justify-content:space-between}.agent .eyebrow{color:#8ff9e0}.step{display:flex;align-items:center;gap:13px;padding:10px 0;border-bottom:1px solid #2b4c51;font-size:12px}.step b{color:#79f5d7;font-size:11px;width:22px}.step span{color:#b9d4d8}.step small{margin-left:auto;color:#77b3ae}.actions{display:flex;gap:9px;margin-top:12px}.actions button{flex:1}.field{margin:16px 0}.field label{display:block;color:#8baab8;font-size:12px;margin-bottom:8px}.policygrid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.metricrow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{background:#0d2b38;padding:16px;border-radius:11px}.metric small{display:block;color:#8aafbd}.metric b{font-size:25px;font-family:'Space Grotesk'}.compare{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #294354;font-size:12px}.compare span{color:#a8c1cc}.notice{border:1px solid #725c3b;background:#3b3028;color:#e6cb95;border-radius:9px;padding:12px;font-size:12px;line-height:1.6;margin:13px 0}.timeline{padding:13px 0;border-bottom:1px solid #2c4354;font-size:12px}.timeline b{color:#d8f5f0}.timeline small{display:block;color:#8ea7b6;margin-top:6px}.hidden{display:none!important}.highlight{color:#69ebcc}.tour{position:fixed;bottom:22px;right:25px;background:#1c4650;border:1px solid #58d8c0;padding:13px 18px;border-radius:14px;font-size:12px;box-shadow:0 15px 45px #0008;z-index:5}.tour b{color:#76ffdd}.sectionline{border-top:1px solid #284456;margin:18px 0}.two{display:flex;gap:10px}.two>*{flex:1}@media(max-width:1000px){.shell{grid-template-columns:70px 1fr}.side{padding:20px 6px}.brand{font-size:13px}.brand small,.nav .navtext,.foot{display:none}.nav{justify-content:center}.main{padding:22px}.cards{grid-template-columns:repeat(2,1fr)}.workspace,.grid{grid-template-columns:1fr}}@media(max-width:650px){.cards,.policygrid,.detailgrid,.metricrow{grid-template-columns:1fr}.topright{display:none}}
</style></head><body><div class="shell"><aside class="side"><div class="brand">REFUND<em>/</em>OPS<small>DECISION INTELLIGENCE</small></div><button class="nav active" data-page="overview"><span class="symbol">◈</span><span class="navtext">Mission Control</span></button><button class="nav" data-page="queue"><span class="symbol">▤</span><span class="navtext">Investigation Desk</span></button><button class="nav" data-page="policy"><span class="symbol">⌘</span><span class="navtext">Policy Studio</span></button><button class="nav" data-page="audit"><span class="symbol">◷</span><span class="navtext">Decision Ledger</span></button><div class="foot"><strong>● SANDBOX ACTIVE</strong><br/>Real CSV · No payments<br/>Evidence-first automation</div></aside><main class="main"><div class="top"><div class="eyebrow">OPERATIONS INTELLIGENCE <span style="color:#5b7a8c"> / </span> REFUND DECISIONS</div><div class="topright"><span class="live"></span> DECISION ENGINE ONLINE <span id="version">POLICY v1</span><span class="avatar">OM</span></div></div><div id="content"></div></main></div><div id="tour" class="tour">✦ <b>LIVE PRODUCT EXPERIENCE</b> · Real case data · Agent trace · Policy replay</div><script>
const $=s=>document.querySelector(s),api=async(p,body)=>{let r=await fetch('/api'+p,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});let j=await r.json();if(!r.ok)throw Error(j.detail||'Request failed');return j},usd=n=>'$'+Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data,agent,chosen,draft,impact,active='overview',note='',rationale='',audit=[];const nav=page=>{active=page;document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===page));render()};document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>nav(b.dataset.page));async function refresh(){data=await api('/overview');$('#version').textContent='POLICY v'+data.version;render()};const select=async id=>{chosen=data.items.find(x=>x.request_id===id);agent=null;nav('queue')};const risk=r=>`<span class="risk ${esc(r)}">${esc(r)}</span>`;const row=x=>`<div class="case ${chosen?.request_id===x.request_id?'sel':''}" onclick="select('${esc(x.request_id)}')"><div><div class="caseid">${esc(x.request_id)}</div><small>${esc(x.stated_reason)} · ${esc(x.customer_id)}</small></div>${risk(x.risk)}<b class="amount">${usd(x.amount_usd)}</b></div>`;
function render(){if(!data)return;const all=data.items,auto=all.filter(x=>x.action==='approve'),review=all.filter(x=>x.action!=='approve'),high=all.filter(x=>x.risk==='high');let html='';if(active==='overview'){html=`<div class="hero"><div><div class="eyebrow">LIVE OPERATIONS / REAL PENDING DATA</div><h1>Every decision. <span class="highlight">Under control.</span></h1><p>Evidence-led automation, human judgment where it matters.</p></div><button class="button" onclick="nav('queue')">Open investigation desk ↗</button></div><div class="cards"><div class="card"><small>REQUESTS IN SCOPE</small><strong>${all.length}</strong><div class="sub">Imported from pending.csv</div></div><div class="card"><small>AUTO-ELIGIBLE</small><strong>${auto.length}</strong><div class="sub">${Math.round(100*auto.length/all.length)}% of pending cases</div></div><div class="card"><small>HUMAN REVIEW</small><strong>${review.length}</strong><div class="sub">Policy exceptions / judgment</div></div><div class="card"><small>VALUE REQUIRING REVIEW</small><strong>${usd(review.reduce((a,x)=>a+Number(x.amount_usd||0),0))}</strong><div class="sub">Not a forecast or paid amount</div></div></div><div class="grid"><section class="panel"><div class="panelhead"><div><div class="eyebrow">DECISION DISTRIBUTION</div><h2>What the engine sees</h2></div><span class="tag">POLICY v${data.version}</span></div>${[['Auto-eligible',auto.length],['Human review',review.length],['High risk',high.length]].map(([a,b])=>`<div class="barrow"><span>${a}</span><div class="track"><div class="fill" style="width:${100*b/all.length}%"></div></div><b>${b}</b></div>`).join('')}<div class="sectionline"></div><p>Every case is scored using explicit policy constraints. No money moves in this demo.</p></section><section class="panel"><div class="panelhead"><div><div class="eyebrow">PRIORITY SIGNALS</div><h2>Cases needing judgment</h2></div><button class="button secondary" onclick="nav('queue')">View all ↗</button></div><div class="list">${[...review].sort((a,b)=>(b.risk==='high')-(a.risk==='high')).slice(0,4).map(row).join('')}</div></section></div><div class="panel" style="margin-top:18px"><div class="eyebrow">THE OPERATING MODEL</div><h2>Sense → Investigate → Decide → Learn</h2><p>Policy gates protect automatic approvals. The investigation agent gathers evidence and explains exceptions. Humans approve or escalate. The Policy Time Machine replays every proposed change before activation.</p></div>`}
if(active==='queue'){if(!chosen)chosen=review[0];html=`<div class="hero"><div><div class="eyebrow">INVESTIGATION DESK / HUMAN-IN-COMMAND</div><h1>Investigate with <span class="highlight">context.</span></h1><p>The agent prepares the case. You own the decision.</p></div><span class="tag">${review.length} CASES NEED REVIEW</span></div><div class="workspace"><section class="workpanel"><div class="panelhead"><h2>Review queue</h2><span class="tag">${review.length} open</span></div><input id="search" class="input" placeholder="Search case or customer..." oninput="filterCases(this.value)"/><div class="list" id="case-list" style="margin-top:14px;max-height:700px;overflow:auto">${review.map(row).join('')}</div></section><section class="workpanel" id="case-detail"></section></div>`}
if(active==='policy'){if(!draft)draft={...data.policy};html=`<div class="hero"><div><div class="eyebrow">POLICY STUDIO / COUNTERFACTUAL INTELLIGENCE</div><h1>Change the rules. <span class="highlight">See the impact.</span></h1><p>Simulate first. Approve only when you understand what changes.</p></div><span class="tag">ACTIVE POLICY v${data.version}</span></div><div class="grid" style="grid-template-columns:1fr 1.15fr"><section class="panel"><div class="eyebrow">01 / DRAFT</div><h2>Policy controls</h2><p>Manager-owned controls. Safety exceptions stay protected.</p><div class="policygrid">${[['auto_max_usd','Auto-approval limit','$'],['manual_above_usd','Mandatory review above','$'],['min_tenure_months','Min. customer tenure','months'],['max_prior_refunds','Max prior refunds','count'],['damage_photo_above_usd','Photo evidence above','$']].map(([k,l,u])=>`<div class="field"><label>${l} · ${u}</label><input class="input" type="number" min="0" value="${draft[k]}" onchange="updateDraft('${k}',this.value)"/></div>`).join('')}</div><div class="notice">🔒 Fraud confirmation and warehouse verification cannot be inferred safely from unverified notes. Those auto-approval switches remain disabled.</div><button class="button" onclick="simulate()">✦ Run Policy Time Machine ↗</button></section><section class="panel" id="simulation"><div class="eyebrow">02 / SHADOW REPLAY</div><h2>Before / after</h2><p>Run a simulation to inspect changed decisions and historical exposure.</p></section></div>`}
if(active==='audit'){html=`<div class="hero"><div><div class="eyebrow">DECISION LEDGER / TRACEABILITY</div><h1>Trust is <span class="highlight">auditable.</span></h1><p>Human decisions and policy changes with actor, reason, and timestamp.</p></div><button class="button secondary" onclick="resetDemo()">Reset sandbox</button></div><section class="panel"><h2>Recorded events</h2><div id="audit-list"><p>Loading…</p></div></section>`;api('/audit').then(x=>{$('#audit-list').innerHTML=x.length?x.map(e=>`<div class="timeline"><b>${esc(e.type)}</b> · ${esc(e.request_id||'Policy v'+e.version)}<small>${esc(e.note||e.rationale||'')} · ${esc(e.at)}</small></div>`).join(''):'<p>No events yet. Review a case or activate a policy.</p>'})}
$('#content').innerHTML=html;if(active==='queue')drawDetail();if(active==='policy'&&impact)drawImpact()}
function filterCases(q){$('#case-list').innerHTML=data.items.filter(x=>x.action!=='approve'&&(x.request_id+x.customer_id+x.stated_reason).toLowerCase().includes(q.toLowerCase())).map(row).join('')}
function drawDetail(){if(!chosen)return;const x=chosen;$('#case-detail').innerHTML=`<div class="panelhead"><div><div class="eyebrow">CASE FILE / ${esc(x.request_id)}</div><h2>${esc(x.stated_reason).replaceAll('_',' ')} · ${usd(x.amount_usd)}</h2></div>${risk(x.risk)}</div><div class="detailgrid">${[['CUSTOMER',x.customer_id],['TENURE',x.tenure_months+' months'],['PAST REFUNDS',x.prior_refunds_12m],['DELIVERY AGE',x.days_since_delivery+' days'],['FRAUD FLAG',x.fraud_flag],['POLICY RULE',x.rule]].map(([a,b])=>`<div class="fact"><small>${a}</small><b>${esc(b)}</b></div>`).join('')}</div><div class="agent"><div class="agenttop"><div><div class="eyebrow">✦ INVESTIGATION AGENT</div><h2 style="margin-top:8px">Evidence before opinions.</h2></div><span class="tag">READ-ONLY TOOLS</span></div><p>${esc(x.reason)}</p><button class="button" id="investigate" onclick="investigate()">Run investigation →</button><div id="agent-result"></div></div><div class="eyebrow">HUMAN DECISION GATE</div><p>Evidence: ${esc(x.support_note||'No support note supplied')}. No payment will be executed.</p>${x.review_decision?`<div class="notice">Already resolved: ${esc(x.review_decision.decision)} · ${esc(x.review_decision.note)}</div>`:x.status==='auto_eligible'?'<div class="notice">Already auto-eligible; no reviewer action required.</div>':`<textarea id="note" rows="2" placeholder="Required: evidence and rationale before decision..."></textarea><div class="actions"><button class="button" onclick="decision('approve')">Approve</button><button class="button secondary" onclick="decision('reject')">Reject</button><button class="button secondary" onclick="decision('escalate')">Escalate</button></div>`}`;if(agent)drawAgent()}
async function investigate(){try{agent=await api('/agent/investigate/'+chosen.request_id);drawAgent()}catch(e){alert(e.message)}}
function drawAgent(){if(!agent||!$('#agent-result'))return;$('#agent-result').innerHTML=`<div class="sectionline"></div><div class="eyebrow">AGENT EXECUTION TRACE / 5 TOOLS</div>${agent.tool_trace.map((t,i)=>`<div class="step"><b>0${i+1}</b><span>${esc(t.tool)}</span><small>✓ ${esc(t.status)}</small></div>`).join('')}<div class="sectionline"></div><div class="eyebrow">EVIDENCE & GAPS</div><p>Rule: <b class="highlight">${esc(agent.policy_rule)}</b> · ${agent.historical_customer_cases} prior customer cases · ${agent.historical_reason_cases} matching historical cases</p>${agent.open_questions.map(q=>`<div class="notice">⚠ ${esc(q)}</div>`).join('')}<p style="font-size:11px">${esc(agent.limitations)}</p>`}
async function decision(type){const note=$('#note')?.value?.trim();if(!note)return alert('Document evidence and rationale first.');try{await api('/review/'+chosen.request_id,{decision:type,note});await refresh();chosen=data.items.find(x=>x.request_id===chosen.request_id);drawDetail()}catch(e){alert(e.message)}}
function updateDraft(k,v){draft[k]=Number(v);impact=null;$('#simulation').innerHTML='<div class="eyebrow">02 / SHADOW REPLAY</div><h2>Draft changed</h2><p>Run a new simulation before activating.</p>'}
async function simulate(){try{impact=await api('/policy/simulate',draft);drawImpact()}catch(e){alert(e.message)}}
function drawImpact(){if(!impact||!$('#simulation'))return;const i=impact;$('#simulation').innerHTML=`<div class="eyebrow">02 / POLICY TIME MACHINE</div><h2>Historical replay completed</h2><div class="metricrow"><div class="metric"><small>CURRENT AUTO</small><b>${i.before_auto_count}</b></div><div class="metric"><small>PROPOSED AUTO</small><b>${i.after_auto_count}</b></div><div class="metric"><small>NEW EXPOSURE</small><b>${usd(i.new_auto_exposure_usd)}</b></div></div><div class="sectionline"></div><div class="eyebrow">HISTORICAL COUNTERFACTUAL / ${data.history_count} RECORDS</div><div class="metricrow" style="margin-top:12px"><div class="metric"><small>CHANGED CASES</small><b>${i.historical_changed_count}</b></div><div class="metric"><small>NEW AUTO</small><b>${i.historical_new_auto_count}</b></div><div class="metric"><small>HIST. EXPOSURE</small><b>${usd(i.historical_new_auto_exposure_usd)}</b></div></div><h3 style="margin-top:22px">Cases whose outcome would change</h3><div style="max-height:170px;overflow:auto">${i.pending_changes.length?i.pending_changes.map(c=>`<div class="compare"><b>${esc(c.request_id)}</b><span>${esc(c.before)} → <span class="highlight">${esc(c.after)}</span></span><b>${usd(c.amount_usd)}</b></div>`).join(''):'<p>No pending classification changes.</p>'}</div>${i.warnings.map(w=>`<div class="notice">⚠ ${esc(w)}</div>`).join('')}<div class="notice">Historical outcomes are noisy. Replay is a classification comparison, not a causal estimate of savings or safety.</div><div class="field"><label>Business rationale · required</label><textarea id="rationale" rows="2" placeholder="Why should this change go live?"></textarea></div><button class="button" onclick="activate()">Activate controlled policy v${data.version+1} →</button>`}
async function activate(){const rationale=$('#rationale')?.value?.trim();if(!rationale)return alert('Please document the business rationale.');try{await api('/policy/activate',{...draft,rationale,expected_version:data.version});impact=null;draft=null;await refresh();nav('audit')}catch(e){alert(e.message)}}async function resetDemo(){if(!confirm('Reset demo reviews and policies?'))return;await api('/reset',{});chosen=null;agent=null;impact=null;draft=null;await refresh()}refresh();
</script></body></html>
