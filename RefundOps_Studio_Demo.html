const DEFAULT={auto_max_usd:50,min_tenure_months:6,max_prior_refunds:1,manual_above_usd:300,damage_photo_above_usd:50};
let policy=load('ro_studio_policy',DEFAULT),actions=load('ro_studio_actions',{}),ledger=load('ro_studio_ledger',[]),chosen=null,preview=null,filter='all',search='';
function load(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}
function persist(){try{localStorage.setItem('ro_studio_policy',JSON.stringify(policy));localStorage.setItem('ro_studio_actions',JSON.stringify(actions));localStorage.setItem('ro_studio_ledger',JSON.stringify(ledger))}catch(e){}}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(r){let n=Number(String(r.amount_usd??'').replace(/[^0-9.\-]/g,''));return Number.isFinite(n)?n:0}
function decide(r,p=policy){let a=money(r),reason=String(r.stated_reason||'').trim().toLowerCase(),note=(r.support_note+' '+r.customer_note).toLowerCase();reason=({'changed mind':'changed_mind','arrived damaged':'arrived_damaged','damaged':'arrived_damaged','wrong item':'wrong_item','late':'late_delivery'}[reason]||reason);if(!(a>0&&a<=100000))return ['review','Invalid amount','DATA_INVALID','High'];if(!['yes','no'].includes(r.fraud_flag))return ['review','Unknown fraud status','DATA_INVALID','High'];if(r.fraud_flag==='yes')return ['review','Fraud verification required','FRAUD_HOLD','High'];if(a>p.manual_above_usd)return ['review','Above manager review threshold','HIGH_AMOUNT','High'];if(reason==='changed_mind'&&(!r.days_since_delivery||Number(r.days_since_delivery)>14))return ['review','Outside 14-day window or missing date','OUTSIDE_WINDOW','High'];if(reason==='arrived_damaged'&&a>p.damage_photo_above_usd&&!['photo attached','photo received','image attached','picture attached'].some(x=>note.includes(x)))return ['review','Photo evidence not verified','PHOTO_REQUIRED','Medium'];if(reason==='never_arrived')return ['review','Carrier verification required','CARRIER_CHECK','High'];if(reason==='late_delivery')return ['review','Partial refund requires human judgment','PARTIAL_DISCRETION','Medium'];if(reason==='wrong_item')return ['review','Merchant error requires verification','WRONG_ITEM_VERIFY','Medium'];if(!['wrong_size','changed_mind','arrived_damaged'].includes(reason))return ['review','Unknown reason','UNKNOWN_REASON','High'];if(!r.tenure_months||r.prior_refunds_12m==='')return ['review','Customer history missing','MISSING_HISTORY','Medium'];if(a>p.auto_max_usd)return ['review','Above automatic approval cap','AUTO_CAP','Medium'];if(Number(r.tenure_months)<p.min_tenure_months||Number(r.prior_refunds_12m)>p.max_prior_refunds)return ['review','Customer outside low-risk cohort','CUSTOMER_RISK','Medium'];return ['approve','Eligible low-risk request','LOW_RISK','Low']}
function fmt(n){return '$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function pill(r){let d=decide(r),a=actions[r.request_id];return a?'<span class="pill dark">'+esc(a.split(':')[0])+'</span>':d[0]==='approve'?'<span class="pill good">Auto-eligible</span>':'<span class="pill warn">Needs review</span>'}
function toast(s){let e=document.getElementById('toast');e.textContent=s;e.classList.remove('hidden');clearTimeout(window._to);window._to=setTimeout(()=>e.classList.add('hidden'),3500)}
function show(v){for(let id of ['overview','cases','workspace','policy','ledger'])document.getElementById(id).classList.toggle('hidden',id!==v);document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.view===v));document.getElementById('crumb').textContent=({overview:'Overview',cases:'Cases',workspace:'Case Workspace',policy:'Policy Studio',ledger:'Decision ledger'})[v];if(v==='overview')renderOverview();if(v==='cases')renderCases();if(v==='policy')renderPolicy();if(v==='ledger')renderLedger();window.scrollTo(0,0)}
function table(rows,limit){return `<div class="table-wrap"><table><thead><tr><th>Case</th><th>Customer</th><th>Reason</th><th>Amount</th><th>Status</th><th></th></tr></thead><tbody>${rows.slice(0,limit||999).map(r=>`<tr onclick="openCase('${esc(r.request_id)}')"><td><b>${esc(r.request_id)}</b></td><td>${esc(r.customer_id)}</td><td>${esc(r.stated_reason.replaceAll('_',' '))}</td><td><b>${fmt(money(r))}</b></td><td>${pill(r)}</td><td style="color:#387a61">↗</td></tr>`).join('')}</tbody></table>${rows.length===0?'<div class="empty">No matching cases.</div>':''}</div>`}
function renderOverview(){let auto=PENDING.filter(r=>decide(r)[0]==='approve').length,review=PENDING.length-auto;document.getElementById('navcount').textContent=PENDING.length;document.getElementById('overview').innerHTML=`<div class="pagehead"><div><div class="eyebrow">Operations intelligence</div><h1 class="h1">Good morning, Jordan.</h1><div class="sub">Your refund operations, without the noise. Here’s what needs attention.</div></div><button class="btn primary" onclick="openCase('RF-1070')">Explore a flagged case &nbsp; ↗</button></div><div class="metrics"><div class="panel metric"><div class="label">Incoming requests</div><div class="value">${PENDING.length}</div><div class="foot">Original pending.csv</div></div><div class="panel metric"><div class="label">Ready to automate</div><div class="value">${auto}</div><div class="foot">Policy eligible, not paid</div></div><div class="panel metric"><div class="label">Human attention</div><div class="value">${review}</div><div class="foot">Exceptions routed for review</div></div><div class="panel metric"><div class="label">Automation opportunity</div><div class="value">${(auto/PENDING.length*100).toFixed(1)}%</div><div class="foot">Conservative policy baseline</div></div></div><div class="split"><div class="panel"><div class="list-head"><div><div class="section-title">Cases worth your attention</div><div class="sub">High-risk cases first, based on current policy</div></div><button class="btn small" onclick="show('cases')">View all →</button></div>${table(PENDING.filter(r=>decide(r)[3]==='High').slice(0,6))}</div><div class="panel insight"><div class="eyebrow">The agent's perspective</div><div class="section-title" style="margin-top:9px">Less manual work. Better decisions.</div><div class="hero"><div class="eyebrow">Policy replay · 251 historical cases</div><strong id="replaynum">${HISTORY.filter(r=>decide(r)[0]==='approve').length}</strong><div style="font-weight:700;margin-top:3px">historically auto-eligible</div><p>These cases met the policy conditions. This is eligibility, not proof of decision accuracy.</p><button class="btn small" onclick="show('policy')">Explore policy impact →</button></div><div class="minirow"><span>Policy guardrails</span><b>Enabled</b></div><div class="minirow"><span>Fraud hold</span><b>Always on</b></div><div class="minirow"><span>Financial execution</span><b>Sandbox only</b></div></div></div>`}
function renderCases(){let rows=PENDING.filter(r=>(filter==='all'||(filter==='auto'?decide(r)[0]==='approve':decide(r)[0]==='review'))&&[r.request_id,r.customer_id,r.stated_reason].join(' ').toLowerCase().includes(search.toLowerCase()));document.getElementById('cases').innerHTML=`<div class="pagehead"><div><div class="eyebrow">Case management</div><h1 class="h1">Your review queue.</h1><div class="sub">Every exception has a reason. Every decision has an owner.</div></div><span class="pill">${rows.length} cases</span></div><div class="panel"><div class="list-head"><div class="section-title">All requests</div><div class="flex"><input class="filter" placeholder="Search cases…" value="${esc(search)}" oninput="search=this.value;renderCases();" style="width:170px"><select class="filter" onchange="filter=this.value;renderCases()"><option value="all" ${filter==='all'?'selected':''}>All cases</option><option value="review" ${filter==='review'?'selected':''}>Needs review</option><option value="auto" ${filter==='auto'?'selected':''}>Auto-eligible</option></select></div></div>${table(rows)}</div>`}
function openCase(id){chosen=PENDING.find(r=>r.request_id===id);if(!chosen)return;renderWorkspace();show('workspace')}
function renderWorkspace(){let r=chosen,d=decide(r),fraud=r.fraud_flag==='yes',h=HISTORY.filter(x=>x.customer_id===r.customer_id),similar=HISTORY.filter(x=>x.stated_reason===r.stated_reason);let msg=fraud?'A fraud flag is present in the request. The policy engine has blocked automatic approval. This case needs independent verification.':d[0]==='approve'?'The request meets the current low-risk eligibility conditions. It is safe to recommend for automation, but no payment has been executed.':`I investigated the request and found an exception: ${d[1].toLowerCase()}. I prepared the evidence for human review.`;let traces=[['Retrieved request','Loaded '+r.request_id+' and customer '+r.customer_id],['Checked active policy','Matched rule '+d[2]],['Investigated history',h.length+' previous customer cases'],['Compared similar cases',similar.length+' cases with same reason'],['Evaluated guardrails',d[1]],['Awaiting human input','No financial action executed']];let evidence=[['◈','Customer note',r.customer_note||'No customer note supplied'],['▣','Support note',r.support_note||'No support note supplied'],['◇','Risk signal',fraud?'Fraud flag = yes':d[3]+' policy risk'],['◷','History',h.length+' historical cases · '+r.prior_refunds_12m+' refunds in last 12 months']];document.getElementById('workspace').innerHTML=`<div class="pagehead"><div><div class="eyebrow"><a href="#" onclick="show('cases');return false" style="color:inherit;text-decoration:none">Cases</a> / Investigation workspace</div><h1 class="h1">${esc(r.request_id)} <span style="vertical-align:middle">${pill(r)}</span></h1><div class="sub">${fmt(money(r))} refund · ${esc(r.stated_reason.replaceAll('_',' '))} · ${esc(r.customer_id)}</div></div><div class="flex"><button class="btn" onclick="show('cases')">← Back to queue</button><button class="btn primary" onclick="rerun()">↻ Run investigation</button></div></div><div class="workspace"><div class="workspace-left"><div class="panel cardpad"><div class="agent-head"><span class="agent-icon">✳</span><div><div class="section-title">RefundOps Investigator</div><div class="sub" style="font-size:11px">Evidence-backed case briefing · deterministic tools</div></div><span class="pill good" style="margin-left:auto">Investigation complete</span></div><div class="agent-text">${esc(msg)}</div><div class="facts"><div class="fact"><small>Policy verdict</small><b>${esc(d[2])}</b></div><div class="fact"><small>Historical context</small><b>${h.length} customer cases</b></div><div class="fact"><small>Risk assessment</small><b>${esc(d[3])} priority</b></div></div></div><div class="panel cardpad question"><div class="eyebrow">Human checkpoint</div><div class="qtitle">${fraud?'A fraud signal needs verification. How should we proceed?':d[0]==='approve'?'This case is eligible. Would you like to record a reviewer action?':'The investigation needs your judgment. What is the next step?'}</div><div class="sub" style="margin-bottom:13px">Your response is recorded locally with an audit note. No funds will be transferred.</div><label class="choice"><input type="radio" name="decision" value="Escalated to specialist" checked>Escalate to specialist <span class="pill" style="margin-left:auto">Recommended</span></label><label class="choice"><input type="radio" name="decision" value="Evidence requested">Request additional evidence</label>${fraud?'':'<label class="choice"><input type="radio" name="decision" value="Approved after verification (demo)">Approve after verification (sandbox)</label>'}<label class="choice"><input type="radio" name="decision" value="Rejected">Reject with documented reason</label><div class="right mt"><button class="btn primary" onclick="confirmChoice()">Confirm next step →</button></div></div><div class="panel cardpad"><div class="card-title">Evidence & sources</div>${evidence.map(x=>`<div class="evidence"><div class="eico">${x[0]}</div><div><b>${esc(x[1])}</b><small>${esc(x[2])}</small></div></div>`).join('')}</div></div><div class="workspace-right"><div class="panel cardpad"><div class="flex between" style="margin-bottom:20px"><div class="card-title" style="margin:0">Agent execution</div><span class="pill good">6 steps</span></div><div class="trace">${traces.map((x,i)=>`<div class="trace-item ${i===5?'wait':''}"><b>${esc(x[0])}</b><small>${esc(x[1])}</small></div>`).join('')}</div><button class="btn small" style="width:100%" onclick="openTrace()">View tool call details ↗</button></div><div class="panel cardpad"><div class="card-title">Case context</div>${[['Customer',r.customer_id],['Refund amount',fmt(money(r))],['Product category',r.category],['Customer tenure',r.tenure_months+' months'],['Prior refunds',r.prior_refunds_12m],['Fraud flag',r.fraud_flag]].map(x=>`<div class="kv"><span>${esc(x[0])}</span><b>${esc(x[1])}</b></div>`).join('')}</div><div class="panel cardpad"><div class="card-title">Safe actions</div><div class="actions"><button class="btn primary" onclick="action('Escalated to Fraud Review')">↗ &nbsp; Escalate to ${fraud?'Fraud Review':'specialist'}</button><button class="btn" onclick="action('Evidence requested')">⊕ &nbsp; Request more evidence</button><button class="btn" ${fraud?'disabled title="Blocked by fraud guardrail"':''} onclick="action('Approved after verification (demo)')">✓ &nbsp; Approve after verification</button><button class="btn danger" onclick="rejectModal()">× &nbsp; Reject with reason</button></div><div class="soft mt">${fraud?'Fraud guardrail active. Approval is disabled.':'All actions are simulated and auditable in this browser.'}</div></div></div></div>`}
function rerun(){renderWorkspace();toast('Investigation rerun using the current policy and case data')}
function action(a,note=''){if(!chosen)return;if(chosen.fraud_flag==='yes'&&a.toLowerCase().includes('approv')){toast('Blocked by fraud guardrail');return}actions[chosen.request_id]=a;ledger.unshift({when:new Date().toLocaleString(),id:chosen.request_id,action:a,note:note||'Human reviewer action · sandbox only'});persist();renderWorkspace();toast('Decision saved to local ledger · no payment executed')}
function confirmChoice(){let c=document.querySelector('input[name=decision]:checked');if(!c)return;if(c.value==='Rejected'){rejectModal();return}action(c.value)}
function rejectModal(){document.getElementById('modal').innerHTML=`<div class="modal"><div class="eyebrow">Human approval gate</div><h2>Reject refund request?</h2><p class="sub">Rejection requires a documented reason. The action is simulated.</p><textarea id="rejectnote" placeholder="Explain the policy or evidence behind this decision…"></textarea><div class="flex between"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="let v=document.getElementById('rejectnote').value.trim();if(!v){toast('A reason is required');return}closeModal();action('Rejected',v)">Confirm rejection</button></div></div>`;document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function openTrace(){let r=chosen,d=decide(r),h=HISTORY.filter(x=>x.customer_id===r.customer_id);document.getElementById('modal').innerHTML=`<div class="modal"><div class="flex between"><div><div class="eyebrow">Tool execution record</div><h2>Investigation trace</h2></div><button class="btn ghost" onclick="closeModal()">✕</button></div><div class="soft"><b>get_refund_request</b><br>request_id: ${esc(r.request_id)}<br><br><b>check_policy</b><br>rule: ${esc(d[2])}<br>verdict: ${esc(d[0])}<br><br><b>get_customer_history</b><br>records: ${h.length}<br><br><b>evaluate_guardrails</b><br>${esc(d[1])}<br><br><b>request_human_review</b><br>status: waiting for reviewer</div><p class="sub">This is an auditable, deterministic tool workflow. It does not invoke an LLM.</p><button class="btn primary" onclick="closeModal()">Done</button></div>`;document.getElementById('modal').classList.remove('hidden')}
function renderPolicy(){document.getElementById('policy').innerHTML=`<div class="pagehead"><div><div class="eyebrow">Governed automation</div><h1 class="h1">Policy Studio.</h1><div class="sub">Change the rules. See the consequences. Then decide.</div></div><span class="pill good">Fraud guardrails enforced</span></div><div class="policy-grid"><div class="panel cardpad"><div class="section-title">Draft policy</div><p class="sub">Changes are not active until replayed and explicitly approved.</p><div class="field"><label>Automatic approval ceiling · USD</label><input type="number" min="1" max="300" id="autoCap" value="${policy.auto_max_usd}" oninput="preview=null;document.getElementById('activate').disabled=true"></div><div class="field"><label>Manager review above · USD</label><input type="number" min="1" max="100000" id="manualCap" value="${policy.manual_above_usd}" oninput="preview=null;document.getElementById('activate').disabled=true"></div><div class="field"><label>Minimum customer tenure · months</label><input type="number" min="0" max="120" id="tenure" value="${policy.min_tenure_months}" oninput="preview=null;document.getElementById('activate').disabled=true"></div><div class="flex"><button class="btn primary" onclick="simulate()">Run historical replay →</button><button class="btn" id="activate" disabled onclick="activatePolicy()">Activate policy</button></div><div class="soft mt">Always enforced: fraud flags, required evidence and 14-day change-of-mind window.</div></div><div class="panel cardpad"><div class="eyebrow">Policy Time Machine</div><div class="section-title" style="margin:10px 0 16px">See impact before activation</div><div id="simulation"><div class="soft">Run a replay to compare the active and proposed policies across ${HISTORY.length} historical requests and ${PENDING.length} pending cases.</div></div></div></div>`}
function draftPolicy(){return {...policy,auto_max_usd:Number(document.getElementById('autoCap').value),manual_above_usd:Number(document.getElementById('manualCap').value),min_tenure_months:Number(document.getElementById('tenure').value)}}
function simulate(){let p=draftPolicy();if(!(p.auto_max_usd>0&&p.manual_above_usd>=p.auto_max_usd&&p.min_tenure_months>=0)){toast('Invalid policy: manager threshold must be ≥ auto cap');return}let before=HISTORY.filter(r=>decide(r,policy)[0]==='approve').length,after=HISTORY.filter(r=>decide(r,p)[0]==='approve').length,changed=HISTORY.filter(r=>decide(r,policy)[0]!==decide(r,p)[0]);preview={p,before,after,changed};document.getElementById('simulation').innerHTML=`<div class="compare"><div><small>Current eligibility</small><strong>${before}</strong><small>historical cases</small></div><div><small>Proposed eligibility</small><strong>${after}</strong><small>historical cases</small></div></div><div class="minirow"><span>Decisions that would change</span><b>${changed.length}</b></div><div class="minirow"><span>Value of changed cases</span><b>${fmt(changed.reduce((a,r)=>a+money(r),0))}</b></div><div class="minirow"><span>Pending auto-eligible</span><b>${PENDING.filter(r=>decide(r,p)[0]==='approve').length} / ${PENDING.length}</b></div><div class="soft mt">Replay shows rule impact, not actual fraud-loss predictions or financial outcomes. Human activation required.</div>`;document.getElementById('activate').disabled=false;toast('Historical replay complete. Review impact before activating.')}
function activatePolicy(){if(!preview){toast('Run replay first');return}let p=draftPolicy();if(JSON.stringify(p)!==JSON.stringify(preview.p)){toast('Inputs changed. Rerun replay.');return}let prev=policy;policy=p;ledger.unshift({when:new Date().toLocaleString(),id:'POLICY',action:'Policy activated',note:`Auto cap ${prev.auto_max_usd} → ${p.auto_max_usd}; ${preview.changed.length} historical cases changed`});persist();renderPolicy();toast('Policy activated in sandbox. Fraud guardrail preserved.')}
function renderLedger(){document.getElementById('ledger').innerHTML=`<div class="pagehead"><div><div class="eyebrow">Governance</div><h1 class="h1">Decision ledger.</h1><div class="sub">Every reviewer decision and policy activation in one place.</div></div><button class="btn" onclick="if(confirm('Clear local demo audit history?')){ledger=[];actions={};persist();renderLedger()}">Reset local demo</button></div><div class="panel"><div class="list-head"><div class="section-title">Activity log</div><span class="pill">Local browser storage</span></div>${ledger.length?`<div class="table-wrap"><table><thead><tr><th>Time</th><th>Record</th><th>Action</th><th>Context</th></tr></thead><tbody>${ledger.map(x=>`<tr><td>${esc(x.when)}</td><td><b>${esc(x.id)}</b></td><td>${esc(x.action)}</td><td>${esc(x.note)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No decisions yet. Investigate a case or activate a policy to begin.</div>'}</div>`}
function openCmd(){document.getElementById('cmd').classList.remove('hidden');document.getElementById('command').focus()}
function closeCmd(){document.getElementById('cmd').classList.add('hidden')}
function commandAction(text){document.getElementById('command').value=text;runCommand()}
function runCommand(){let s=document.getElementById('command').value.trim(),id=s.match(/RF-\d+/i),cap=s.match(/(?:cap|approval|threshold).*?\$?(\d+)/i);if(id){closeCmd();openCase(id[0].toUpperCase());return}if(/high.?risk|risk cases/i.test(s)){filter='review';search='';closeCmd();show('cases');toast('Showing cases requiring review');return}if(cap){closeCmd();show('policy');document.getElementById('autoCap').value=cap[1];toast('Policy draft prepared. Run replay before activation.');return}document.getElementById('cmdresult').innerHTML='<div class="soft">I can investigate a case ID, show high-risk cases, or draft an approval cap. This demo does not use a live LLM.</div>'}
document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>show(b.dataset.view)));document.getElementById('command').addEventListener('keydown',e=>{if(e.key==='Enter')runCommand()});document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCmd()}if(e.key==='Escape'){closeCmd();closeModal()}});show('overview');
</script></body></html>
